name: Sync Inter font

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest Inter release
        id: release
        run: |
          data=$(curl -sL https://api.github.com/repos/rsms/inter/releases/latest)
          tag=$(echo "$data" | jq -r '.tag_name')
          url=$(echo "$data" | jq -r '.assets[] | select(.name | test("^Inter-.*\\.zip$")) | .browser_download_url')
          # Both come from another repo's release: accept only the expected shapes
          [[ "$tag" =~ ^v[0-9]+(\.[0-9]+)*$ ]] || { echo "Unexpected tag: $tag"; exit 1; }
          [[ "$url" =~ ^https://github\.com/rsms/inter/releases/download/[A-Za-z0-9._/-]+\.zip$ ]] || { echo "Unexpected URL: $url"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v6

      # Outputs reach the shell as env vars, never pasted into the script
      - name: Download, extract and subset
        env:
          URL: ${{ steps.release.outputs.url }}
        run: |
          curl -sL -o inter.zip "$URL"
          mkdir -p src/assets/fonts
          unzip -j -o inter.zip "web/InterVariable.woff2" -d /tmp/inter
          unzip -p inter.zip "LICENSE.txt" > src/assets/fonts/LICENSE-Inter.txt
          .github/scripts/subset-inter.sh /tmp/inter/InterVariable.woff2

      - name: Commit if changed
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- src/assets/fonts; then
            git add src/assets/fonts
            git commit -m "chore: sync Inter font to $TAG"
            git push
          else
            echo "No changes."
          fi
